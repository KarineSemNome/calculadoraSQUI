<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quanto eu posso faltar?</title>

  <!-- FAVICON (ÍCONE DA ABA) -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2680/2680882.png">

  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; background-color: #fe3867; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .resultado { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; font-size: 16px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Quanto eu posso faltar?</h2>
    
    <form onsubmit="calcular(event)">
      <div class="input-group">
        <label for="materia">Selecione a Matéria:</label>
        <select id="materia">
          <option value="20">Química Analítica</option>
          <option value="20">Química Orgânica</option>
          <option value="15">Química Inorgânica</option>
          <option value="15">Técnicas e Análises Microbiológicas</option>
          <option value="10">Química Ambiental</option>
          <option value="15">Físico-Química</option>
          <option value="5">Relações Interpessoais</option>
        </select>
      </div>

      <div class="input-group">
        <label for="minhasFaltas">Quantas faltas você tem?</label>
        <!-- Adicionado min="0" e max="127" no input -->
        <input type="number" id="minhasFaltas" placeholder="Ex: 3" min="0" max="127">
      </div>

      <button type="submit">Verificar Faltas Restantes</button>
    </form>

    <div id="resultado" class="resultado"></div>
  </div>

  <script>
    function calcular(event) {
      if (event) event.preventDefault();

      const select = document.getElementById('materia');
      const nomeMateria = select.options[select.selectedIndex].text.split(' (')[0];
      const limite = parseInt(select.value);
      const inputFaltas = document.getElementById('minhasFaltas');
      
      let minhasFaltas = parseInt(inputFaltas.value) || 0;

      // Validação JS: se o usuário digitar mais de 127, força a ficar em 127
      if (minhasFaltas > 127) {
        minhasFaltas = 127;
        inputFaltas.value = 127; // atualiza o campo visível
      }

      const restantes = limite - minhasFaltas;
      const divResultado = document.getElementById('resultado');
      divResultado.style.display = 'block';

      if (restantes > 0) {
        const palavraRestante = (restantes === 1) ? "falta" : "faltas";
        divResultado.innerHTML = `Você ainda pode ter <strong>${restantes}</strong> ${palavraRestante} em <strong>${nomeMateria}</strong>.`;

      } else if (restantes === 0) {
        divResultado.innerHTML = `Cuidado Química! Você atingiu o limite de <strong>${limite}</strong> faltas em <strong>${nomeMateria}</strong>.`;

      } else {
        const excesso = Math.abs(restantes);
        const palavraExcesso = (excesso === 1) ? "falta" : "faltas";
        divResultado.innerHTML = `Lamentável Química, você estourou o limite de <strong>${nomeMateria}</strong> em <strong>${excesso}</strong> ${palavraExcesso}!`;
      }
    }
  </script>

</body>
</html>
