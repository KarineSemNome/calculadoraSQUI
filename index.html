<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat com Limpeza Local</title>
  <style>
    /* Estilos básicos para o exemplo */
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .chat-janela-flutuante { width: 350px; background: #222; color: #fff; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; height: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .chat-cabecalho { background: #333; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .chat-cabecalho h3 { margin: 0; font-size: 16px; }
    .btn-fechar-chat { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; }
    .chat-mensagens { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-balao { background: #333; padding: 8px 10px; border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    .chat-balao.mencionado { border-left: 3px solid #FFD800; background: #3a3822; }
    .chat-balao-topo { display: flex; justify-content: space-between; align-items: center; }
    .chat-balao-info-esquerda { display: flex; align-items: center; gap: 6px; }
    .chat-avatar-mini { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .chat-autor { font-weight: bold; font-size: 12px; color: #aaa; }
    .chat-acoes-msg { display: flex; gap: 4px; }
    .btn-acao-msg { background: none; border: none; color: #888; font-size: 11px; cursor: pointer; padding: 0; }
    .btn-acao-msg:hover { color: #fff; }
    .chat-texto { word-break: break-word; }
    .chat-data { font-size: 10px; color: #777; align-self: flex-end; }
  </style>
</head>
<body>

  <!-- JANELA FLUTUANTE DO CHAT -->
  <div id="janelaChatFlutuante" class="chat-janela-flutuante">
    <div class="chat-cabecalho">
      <h3>Chat da Turma</h3>
      <div style="display: flex; gap: 8px; align-items: center;">
        <!-- Botão de lixeira para limpar as mensagens localmente -->
        <button class="btn-fechar-chat" onclick="limparChatLocalmente()" title="Limpar chat para mim" style="font-size: 14px;">🗑️</button>
        <button class="btn-fechar-chat" onclick="alternarJanelaChat()">✕</button>
      </div>
    </div>
    
    <!-- Container de Mensagens -->
    <div id="chatMensagens" class="chat-mensagens">
      <p style="text-align: center; font-size: 12px; opacity: 0.8;">Carregando mensagens...</p>
    </div>
  </div>

  <script type="module">
    // Exemplo de variáveis globais que normalmente você já teria no seu escopo do Firebase
    // import { initializeApp } from "https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js";
    // import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore.js";

    let unsubscribeChat = null;
    let uidAtual = "usuario_exemplo_123"; // Substitua pelo UID real do usuário logado
    let usuarioAtual = "João Silva"; // Substitua pelo nome real do usuário
    let dadosUsuarioAtual = { isAdm: false }; // Dados do usuário atual

    // Função que escuta e renderiza as mensagens do Firestore em tempo real
    window.escutarChat = function() {
      // Exemplo simulado de referência do banco de dados (substitua pela sua instância 'db' real)
      // const q = query(collection(db, "chat"), orderBy("criadoEm", "asc"));
      
      /* 
      // CÓDIGO REAL COM FIREBASE:
      if (unsubscribeChat) unsubscribeChat(); // Evita múltiplos listeners duplicados

      unsubscribeChat = onSnapshot(q, (snapshot) => {
        processarMensagensChat(snapshot);
      });
      */
    }

    window.processarMensagensChat = function(snapshot) {
      const containerChat = document.getElementById('chatMensagens');
      let html = "";

      if (snapshot.empty) {
        containerChat.innerHTML = `<p style="text-align: center; font-size: 12px; opacity: 0.8;">Nenhuma mensagem ainda. Seja o primeiro a falar!</p>`;
        return;
      }

      // Recupera o timestamp limite armazenado no localStorage específico deste usuário
      const ultimaLimpezaKey = `chat_limpo_ate_${uidAtual}`;
      const limpoAteTimestamp = parseInt(localStorage.getItem(ultimaLimpezaKey) || "0", 10);

      let mensagensVisiveis = 0;

      snapshot.forEach((docSnap) => {
        const msg = docSnap.data();
        const msgId = docSnap.id;

        // Filtra mensagens criadas antes do clique em "limpar chat" do usuário
        if (msg.criadoEm) {
          const msgTimestamp = msg.criadoEm.toMillis();
          if (msgTimestamp <= limpoAteTimestamp) {
            return; // Pula mensagens antigas ignoradas pela limpeza local
          }
        }

        mensagensVisiveis++;
        const foto = msg.foto || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const dataHora = msg.criadoEm ? new Date(msg.criadoEm.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        
        let botoesAcao = "";
        const eAdm = dadosUsuarioAtual && (dadosUsuarioAtual.isAdm || usuarioAtual.toLowerCase().includes("júlio canto") || usuarioAtual.toLowerCase().includes("julio canto"));
        
        if (msg.uid === uidAtual) {
          botoesAcao += `<button class="btn-acao-msg editar" onclick="iniciarEdicaoMensagem('${msgId}', '${encodeURIComponent(msg.texto)}')">Editar</button>`;
        }
        if (msg.uid === uidAtual || eAdm) {
          botoesAcao += `<button class="btn-acao-msg apagar" onclick="apagarMensagemChat('${msgId}')">Apagar</button>`;
        }

        let classeMencao = "";
        if (msg.texto.includes(`@${usuarioAtual}`) || msg.texto.includes("@todos")) {
          classeMencao = "mencionado";
        }

        let textoFormatado = msg.texto.replace(/(@[\wÀ-ÿ\s]+)/g, '<span style="color: #FFD800; font-weight: bold;">$1</span>');

        html += `
          <div class="chat-balao ${classeMencao}">
            <div class="chat-balao-topo">
              <div class="chat-balao-info-esquerda">
                <img src="${foto}" class="chat-avatar-mini" alt="Foto">
                <span class="chat-autor">${msg.autor}</span>
              </div>
              <div class="chat-acoes-msg">${botoesAcao}</div>
            </div>
            <div class="chat-texto">${textoFormatado}</div>
            <div class="chat-data">${dataHora}</div>
          </div>
        `;
      });

      if (mensagensVisiveis === 0) {
        containerChat.innerHTML = `<p style="text-align: center; font-size: 12px; opacity: 0.8;">O chat está limpo para você. Novas mensagens aparecerão aqui.</p>`;
      } else {
        containerChat.innerHTML = html;
      }
      
      containerChat.scrollTop = containerChat.scrollHeight;
    }

    // Função global acionada pelo botão da lixeira no cabeçalho
    window.limparChatLocalmente = function() {
      if (confirm("Deseja limpar as conversas da sua tela? (Elas continuarão salvas no histórico geral para os outros usuários).")) {
        const agoraTimestamp = Date.now();
        const ultimaLimpezaKey = `chat_limpo_ate_${uidAtual}`;
        
        // Salva o momento exato da limpeza no navegador do usuário
        localStorage.setItem(ultimaLimpezaKey, agoraTimestamp);
        
        // Força a re-execução da renderização para atualizar a tela instantaneamente
        // (No seu código real com Firebase, chame a função que redesenha ou o onSnapshot pegará a mudança se for reavaliado)
        document.getElementById('chatMensagens').innerHTML = `<p style="text-align: center; font-size: 12px; opacity: 0.8;">O chat está limpo para você. Novas mensagens aparecerão aqui.</p>`;
      }
    };

    window.alternarJanelaChat = function() {
      const janela = document.getElementById('janelaChatFlutuante');
      janela.style.display = janela.style.display === 'none' ? 'flex' : 'none';
    };
  </script>
</body>
</html>
