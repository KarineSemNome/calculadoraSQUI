<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle do SQUI</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    /* CARD CONTAINER */
    .app-container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* CABEÇALHO */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD800, #FF6B00);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      color: #000;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(255, 216, 0, 0.3);
    }

    .user-name {
      font-size: 16px;
      font-weight: 700;
    }

    .user-badge {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* NAVEGAÇÃO / TABS */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #FFD800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* CONTEÚDO DAS ABAS */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #fff;
    }

    /* FORMULÁRIOS DE LOGIN E CADASTRO */
    .auth-box {
      text-align: center;
    }

    .auth-box h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .auth-box p {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: rgba(255,255,255,0.8);
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-group input:focus {
      border-color: #FFD800;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #FFD800, #FF8800);
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .toggle-auth {
      margin-top: 15px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .toggle-auth span {
      color: #FFD800;
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
    }

    /* LISTA DO CRONOGRAMA & ATIVIDADES */
    .cronograma-lista {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cronograma-item {
      background: rgba(0, 0, 0, 0.2);
      border-left: 4px solid #FFD800;
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .horario-tag {
      font-size: 11px;
      background: rgba(255, 216, 0, 0.2);
      color: #FFD800;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .categoria-materia {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .aviso-livre {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
    }

    /* SCROLLBAR DOS BOTÕES DAS MATÉRIAS */
    #botoesMaterias::-webkit-scrollbar {
      height: 4px;
    }
    #botoesMaterias::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    #botoesMaterias::-webkit-scrollbar-thumb {
      background: rgba(255,216,0,0.4);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- SEÇÃO DE AUTENTICAÇÃO -->
    <div id="secaoAuth" class="auth-box">
      <h1 id="tituloAuth">Entrar no Painel</h1>
      <p id="subtituloAuth">Acesse seus horários e atividades da semana</p>

      <form id="formAuth">
        <div class="input-group" id="grupoNome" style="display: none;">
          <label>Nome Completo</label>
          <input type="text" id="inputNome" placeholder="Digite seu nome">
        </div>

        <div class="input-group">
          <label>E-mail</label>
          <input type="email" id="inputEmail" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="inputSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnSubmitAuth" class="btn-primary">Entrar</button>
      </form>

      <div class="toggle-auth">
        <span id="textoToggleAuth">Não tem conta? Cadastre-se</span>
      </div>
    </div>

    <!-- SEÇÃO DO PAINEL -->
    <div id="secaoPainel" style="display: none;">
      
      <!-- HEADER DO USUÁRIO -->
      <div class="header">
        <div class="user-info">
          <div class="avatar" id="avatarUsuario">U</div>
          <div>
            <div class="user-name" id="nomeUsuario">Nome do Aluno</div>
            <div class="user-badge" id="badgeUsuario">Aluno</div>
          </div>
        </div>
        <button class="btn-logout" id="btnSair">Sair</button>
      </div>

      <!-- BOTÕES DE COMPONENTES/ABAS -->
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="trocarAba('abaHoje')">Aulas Hoje</button>
        <button class="tab-btn" onclick="trocarAba('abaAulasSemana')">Aulas Semana</button>
        <button class="tab-btn" onclick="trocarAba('abaAtividades')">Atividades</button>
      </div>

      <!-- ABA 1: HOJE -->
      <div id="abaHoje" class="tab-content active">
        <h2>Aulas de Hoje</h2>
        <div id="conteudoAulasHoje"></div>
      </div>

      <!-- ABA 2: AULAS DA SEMANA -->
      <div id="abaAulasSemana" class="tab-content">
        <h2>Horário Semanal</h2>
        <div id="conteudoAulasSemana"></div>
      </div>

      <!-- ABA 3: ATIVIDADES DA SEMANA (COM FILTRO POR MATÉRIA) -->
      <div id="abaAtividades" class="tab-content">
        <h2>Atividades por Matéria</h2>
        
        <!-- BARRA DE BOTÕES SLIDER DAS MATÉRIAS -->
        <div id="botoesMaterias" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: thin;">
          <!-- Gerado dinamicamente via JS -->
        </div>

        <!-- CONTEÚDO DA MATÉRIA SELECIONADA -->
        <div id="conteudoAtividades"></div>
      </div>

    </div>

  </div>

  <!-- LÓGICA EM JAVASCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. CONFIGURAÇÃO DO FIREBASE
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    // 2. CONFIGURAÇÃO DO SEU REPOSITÓRIO NO GITHUB MAIN
    const USUARIO_GITHUB = "SEU_USUARIO"; 
    const REPOS_GITHUB = "SEU_REPOSITORIO";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const cronogramaSemanal = {
      0: [],
      1: [{ materia: "Físico-Química", horario: "07:30 - 09:10" }, { materia: "Operações Unitárias", horario: "09:30 - 11:10" }],
      2: [{ materia: "Química Orgânica", horario: "07:30 - 09:10" }],
      3: [{ materia: "Cálculo Técnico", horario: "07:30 - 11:10" }],
      4: [{ materia: "Microbiologia Industrial", horario: "08:20 - 11:10" }],
      5: [{ materia: "Análise Instrumental", horario: "07:30 - 09:10" }],
      6: []
    };

    const nomesDias = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

    // ESTRUTURA DAS ATIVIDADES ORGANIZADAS POR PASTA DA MATÉRIA
    const atividadesDaSemana = {
      "Físico-Química": [
        { titulo: "Relatório de Termodinâmica", prazo: "Entrega: Sex - 23:59", arquivo: "FisicoQuimica/relatorio_termo.pdf" }
      ],
      "Operações Unitárias": [
        { titulo: "Exercícios de Balanço de Massa", prazo: "Entrega: Seg - 12:00", arquivo: "OperacoesUnitarias/balanco_massa.pdf" }
      ],
      "Química Orgânica": [],
      "Cálculo Técnico": [
        { titulo: "Lista de Integrais Aplicadas", prazo: "Entrega: Qua - 18:00", arquivo: "CalculoTecnico/lista_integrais.pdf" }
      ],
      "Microbiologia Industrial": [],
      "Análise Instrumental": [
        { titulo: "Espectrofotometria UV-Vis", prazo: "Entrega: Qui - 23:59", arquivo: "AnaliseInstrumental/espectro.pdf" }
      ]
    };

    let materiaAtivaAtividades = "Físico-Química";
    let modoCadastro = false;

    // DOM
    const secaoAuth = document.getElementById('secaoAuth');
    const secaoPainel = document.getElementById('secaoPainel');
    const formAuth = document.getElementById('formAuth');
    const tituloAuth = document.getElementById('tituloAuth');
    const subtituloAuth = document.getElementById('subtituloAuth');
    const grupoNome = document.getElementById('grupoNome');
    const btnSubmitAuth = document.getElementById('btnSubmitAuth');
    const textoToggleAuth = document.getElementById('textoToggleAuth');
    const btnSair = document.getElementById('btnSair');

    // TOGGLE AUTENTICAÇÃO
    textoToggleAuth.addEventListener('click', () => {
      modoCadastro = !modoCadastro;
      if (modoCadastro) {
        tituloAuth.innerText = "Criar Conta";
        subtituloAuth.innerText = "Cadastre-se para acessar os horários";
        grupoNome.style.display = "block";
        btnSubmitAuth.innerText = "Cadastrar";
        textoToggleAuth.innerText = "Já possui uma conta? Faça login";
      } else {
        tituloAuth.innerText = "Entrar no Painel";
        subtituloAuth.innerText = "Acesse seus horários e atividades da semana";
        grupoNome.style.display = "none";
        btnSubmitAuth.innerText = "Entrar";
        textoToggleAuth.innerText = "Não tem conta? Cadastre-se";
      }
    });

    // SUBMIT AUTH
    formAuth.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('inputEmail').value;
      const senha = document.getElementById('inputSenha').value;

      try {
        if (modoCadastro) {
          const nomeInput = document.getElementById('inputNome').value;
          const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
          const user = userCredential.user;

          // LINHA 386: VERIFICAÇÃO DE ADM
          const eAdm = (nomeInput.toLowerCase() === "júlio canto" || nomeInput.toLowerCase() === "julio canto");

          await setDoc(doc(db, "usuarios", user.uid), {
            nome: nomeInput,
            email: email,
            isAdm: eAdm
          });

        } else {
          await signInWithEmailAndPassword(auth, email, senha);
        }
      } catch (error) {
        alert("Erro na autenticação: " + error.message);
      }
    });

    btnSair.addEventListener('click', () => signOut(auth));

    // OBSERVER
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const docRef = doc(db, "usuarios", user.uid);
        const docSnap = await getDoc(docRef);

        let nome = "Aluno";
        let eAdm = false;

        if (docSnap.exists()) {
          const dados = docSnap.data();
          nome = dados.nome || "Aluno";
          eAdm = dados.isAdm || false;
        }

        document.getElementById('nomeUsuario').innerText = nome;
        document.getElementById('avatarUsuario').innerText = nome.charAt(0).toUpperCase();
        document.getElementById('badgeUsuario').innerText = eAdm ? "Administrador" : "Aluno";

        secaoAuth.style.display = "none";
        secaoPainel.style.display = "block";

        carregarAulasHoje();
        carregarAulasSemana();
        carregarAtividades();

      } else {
        secaoAuth.style.display = "block";
        secaoPainel.style.display = "none";
      }
    });

    function carregarAulasHoje() {
      const container = document.getElementById('conteudoAulasHoje');
      const diaHoje = new Date().getDay();
      const aulasHoje = cronogramaSemanal[diaHoje] || [];

      if (aulasHoje.length === 0) {
        container.innerHTML = `<div class="aviso-livre">Nenhuma aula agendada para hoje! 🎉</div>`;
        return;
      }

      let html = `<div class="categoria-materia">${nomesDias[diaHoje]}</div><ul class="cronograma-lista">`;
      aulasHoje.forEach(item => {
        html += `<li class="cronograma-item"><strong>${item.materia}</strong><span class="horario-tag">${item.horario}</span></li>`;
      });
      html += `</ul>`;

      container.innerHTML = html;
    }

    function carregarAulasSemana() {
      const container = document.getElementById('conteudoAulasSemana');
      let html = "";

      for (let i = 1; i <= 5; i++) {
        const aulasDia = cronogramaSemanal[i];
        if (aulasDia.length > 0) {
          html += `<div class="categoria-materia" style="margin-top: 15px;"><strong>${nomesDias[i]}</strong></div><ul class="cronograma-lista">`;
          aulasDia.forEach(item => {
            html += `<li class="cronograma-item"><strong>${item.materia}</strong><span class="horario-tag">${item.horario}</span></li>`;
          });
          html += `</ul>`;
        }
      }

      container.innerHTML = html;
    }

    // NOVA LÓGICA DE BOTÕES DAS MATÉRIAS
    function carregarAtividades() {
      const containerBotoes = document.getElementById('botoesMaterias');
      const containerConteudo = document.getElementById('conteudoAtividades');

      // 1. Renderiza os botões dinamicamente
      let htmlBotoes = "";
      Object.keys(atividadesDaSemana).forEach(materia => {
        const estaAtivo = (materia === materiaAtivaAtividades);
        const estiloBotao = estaAtivo 
          ? "background: #FFD800; color: #000; font-weight: bold; border: 2px solid #fff;" 
          : "background: rgba(0, 0, 0, 0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2);";

        htmlBotoes += `
          <button 
            type="button" 
            onclick="filtrarMateriaAtividades('${materia}')" 
            style="width: auto; padding: 8px 14px; font-size: 12px; border-radius: 20px; white-space: nowrap; cursor: pointer; transition: all 0.2s; ${estiloBotao}">
            ${materia}
          </button>
        `;
      });
      containerBotoes.innerHTML = htmlBotoes;

      // 2. Renderiza o conteúdo da matéria ativa
      const listaAtividades = atividadesDaSemana[materiaAtivaAtividades] || [];

      if (listaAtividades.length === 0) {
        containerConteudo.innerHTML = `
          <div class="aviso-livre" style="font-size: 14px; padding: 14px; margin-top: 10px;">
            Nenhuma atividade pendente em ${materiaAtivaAtividades}! 🎉
          </div>
        `;
        return;
      }

      let htmlConteudo = `<div class="categoria-materia"><strong>${materiaAtivaAtividades}</strong></div><ul class="cronograma-lista">`;
      
      listaAtividades.forEach(item => {
        const urlDownloadGithub = `https://raw.githubusercontent.com/${USUARIO_GITHUB}/${REPOS_GITHUB}/main/${item.arquivo}`;
        
        const linkDownload = item.arquivo 
          ? `<a href="${urlDownloadGithub}" download target="_blank" style="display:inline-block; margin-top:6px; font-size:12px; color:#FFD800; font-weight:bold; text-decoration:underline;">📥 Baixar Arquivo</a>` 
          : "";

        htmlConteudo += `
          <li class="cronograma-item">
            <div>
              <strong>${item.titulo}</strong>
              <br>${linkDownload}
            </div>
            <span class="horario-tag">${item.prazo}</span>
          </li>
        `;
      });

      htmlConteudo += `</ul>`;
      containerConteudo.innerHTML = htmlConteudo;
    }

    // FUNÇÕES DE NAVEGAÇÃO E SELEÇÃO
    window.filtrarMateriaAtividades = function(materia) {
      materiaAtivaAtividades = materia;
      carregarAtividades();
    };

    window.trocarAba = function(idAba) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(idAba).classList.add('active');
      event.currentTarget.classList.add('active');
    };
  </script>
</body>
</html>
